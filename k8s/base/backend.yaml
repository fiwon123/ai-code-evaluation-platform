apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-eval-backend
  labels:
    app.kubernetes.io/name: ai-evaluation-platform
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-evaluation-platform
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: backend
          # Image built by scripts/k8s-setup.sh (make k8s-setup).
          image: eval-backend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: ai-eval-config
            - secretRef:
                name: ai-eval-secrets
          # Readiness/liveness probes hit the FastAPI /health endpoint.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ai-eval-backend
  labels:
    app.kubernetes.io/name: ai-evaluation-platform
    app.kubernetes.io/component: backend
spec:
  selector:
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 80
      targetPort: http