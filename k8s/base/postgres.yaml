apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ai-eval-postgres
  labels:
    app.kubernetes.io/name: ai-evaluation-platform
    app.kubernetes.io/component: postgres
spec:
  serviceName: ai-eval-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: postgres
  # Stable storage across pod rescheduling via volumeClaimTemplates.
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-evaluation-platform
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          # pgvector for future embedding support; matches docker-compose.
          image: pgvector/pgvector:pg16
          ports:
            - name: postgres
              containerPort: 5432
          # DB name/user/password kept in sync with ai-eval-secrets DATABASE_URL.
          env:
            - name: POSTGRES_DB
              value: ai_eval
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ai-eval-secrets
                  key: postgres-password
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "ai_eval"]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "ai_eval"]
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
---
apiVersion: v1
kind: Service
metadata:
  name: ai-eval-postgres
  labels:
    app.kubernetes.io/name: ai-evaluation-platform
    app.kubernetes.io/component: postgres
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres