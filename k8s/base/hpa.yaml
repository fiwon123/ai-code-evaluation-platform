apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ai-eval-backend
  labels:
    app.kubernetes.io/name: ai-evaluation-platform
    app.kubernetes.io/component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ai-eval-backend
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70