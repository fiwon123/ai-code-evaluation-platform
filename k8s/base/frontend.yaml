apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-eval-frontend
  labels:
    app.kubernetes.io/name: ai-evaluation-platform
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-evaluation-platform
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          # Image built by scripts/k8s-setup.sh (make k8s-setup).
          image: eval-frontend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          # nginx serves the SPA and reverse-proxies /api to the backend service.
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ai-eval-frontend
  labels:
    app.kubernetes.io/name: ai-evaluation-platform
    app.kubernetes.io/component: frontend
spec:
  selector:
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: http