apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-eval-config
  labels:
    app.kubernetes.io/name: ai-evaluation-platform
data:
  # Application
  ENVIRONMENT: "development"
  LLM_PROVIDER: "demo"
  # CORS — the frontend and API are same-origin in-cluster via the ingress,
  # but keep localhost origins for DevSpace port-forwarding.
  CORS_ORIGINS: '["http://localhost:5173","http://localhost:8000"]'
  ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
  # Cache/queue — no auth on the in-cluster Redis service.
  REDIS_URL: "redis://ai-eval-redis:6379/0"
  # Evaluation sandbox
  EVALUATION_TIMEOUT: "30"
  EVALUATION_DIR: "/tmp/evaluations"
  DOCKER_ENABLED: "false"
  DOCKER_IMAGE: "eval-sandbox:latest"
  DOCKER_MEMORY_LIMIT: "128m"
  DOCKER_CPU_LIMIT: "0.5"
  DOCKER_TIMEOUT: "30"
  DOCKER_NETWORK_DISABLED: "true"
  DOCKER_READONLY_ROOTFS: "true"
  DOCKER_MAX_OUTPUT_BYTES: "65536"
  # Rate limiting
  RATE_LIMIT_ENABLED: "true"
  RATE_LIMIT_ANONYMOUS_LIMIT: "60"
  RATE_LIMIT_AUTHENTICATED_LIMIT: "120"
  RATE_LIMIT_WINDOW_SECONDS: "60"
  # Trusted proxies — the ingress sets X-Forwarded-For.
  TRUSTED_PROXIES: "*"