apiVersion: v1
kind: Secret
metadata:
  name: ai-eval-secrets
  labels:
    app.kubernetes.io/name: ai-evaluation-platform
type: Opaque
# DEV DEFAULT VALUES — overlays (staging/production) MUST override these.
# JWT_SECRET_KEY uses the backend's well-known dev default only in development;
# the backend refuses to boot in production with that value.
stringData:
  DATABASE_URL: "postgresql+psycopg://postgres:postgres@ai-eval-postgres:5432/ai_eval"
  POSTGRES_PASSWORD: "postgres"
  JWT_SECRET_KEY: "dev-secret-key-change-in-production"
  OPENAI_API_KEY: ""
  ANTHROPIC_API_KEY: ""
  GEMINI_API_KEY: ""
  # GitHub OAuth2 (authorization-code flow). Empty by default — the feature is
  # inert until client credentials are supplied (the login button 404s cleanly
  # when unconfigured). Overlays must provide real values.
  GITHUB_CLIENT_ID: ""
  GITHUB_CLIENT_SECRET: ""
  # Ollama needs NO secret: it is keyless by design (local service, see
  # app/services/llm_providers/ollama_provider.py).