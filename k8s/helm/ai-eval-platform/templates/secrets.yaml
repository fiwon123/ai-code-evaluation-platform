apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-eval-platform.fullname" . }}-secrets
  labels:
    {{- include "ai-eval-platform.labels" . | nindent 4 }}
    {{- include "ai-eval-platform.selectorLabels" . | nindent 4 }}
type: Opaque
# Managed-PG escape hatch: disabling the bundled postgres without pointing at
# an external database is a misconfiguration — fail at render time instead of
# shipping a URL that cannot connect.
{{- if and (not .Values.postgres.enabled) (not .Values.secrets.databaseUrl) }}
{{ fail "postgres.enabled=false requires secrets.databaseUrl (managed-PG escape hatch)" }}
{{- end }}
stringData:
  # databaseUrl falls back to the in-chart postgres Service name
  # (postgresServiceName helper) when blank, so the name can never drift from
  # the StatefulSet's Service manifest.
  DATABASE_URL: {{ .Values.secrets.databaseUrl | default (printf "postgresql+psycopg://postgres:%s@%s:5432/ai_eval" (.Values.secrets.postgresPassword | default "postgres") (include "ai-eval-platform.postgresServiceName" .)) | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  JWT_SECRET_KEY: {{ .Values.secrets.jwtSecretKey | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  ANTHROPIC_API_KEY: {{ .Values.secrets.anthropicApiKey | quote }}
  GEMINI_API_KEY: {{ .Values.secrets.geminiApiKey | quote }}
  # GitHub OAuth2 — inert until client credentials are supplied.
  # (Ollama needs no secret: it is keyless by design.)
  GITHUB_CLIENT_ID: {{ .Values.secrets.githubClientId | quote }}
  GITHUB_CLIENT_SECRET: {{ .Values.secrets.githubClientSecret | quote }}