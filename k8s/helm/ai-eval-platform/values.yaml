# Default values for ai-eval-platform.
# Override per environment with values-dev.yaml / values-production.yaml
# or `helm install --set key=value`.

# Image registry/namespace/pullPolicy. The Kind workflow builds local images
# (eval-backend:dev / eval-frontend:dev) and loads them into the cluster, so
# override image.repository/tag accordingly (`make k8s-setup`).
image:
  repository: eval-backend
  backendTag: dev
  frontendTag: dev
  pullPolicy: IfNotPresent

backend:
  replicas: 1
  service:
    port: 80
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  readinessProbe:
    initialDelaySeconds: 10
    periodSeconds: 10
  livenessProbe:
    initialDelaySeconds: 15
    periodSeconds: 20

frontend:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

worker:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

postgres:
  enabled: true
  image: pgvector/pgvector:pg16
  storage: 1Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi

redis:
  enabled: true
  image: redis:7
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

# Application configuration (mirrors k8s/base/configmap.yaml).
config:
  environment: development
  corsOrigins: '["http://localhost:5173","http://localhost:8000"]'
  redisUrl: "redis://ai-eval-platform-redis:6379/0"
  llmProvider: demo
  accessTokenExpireMinutes: "1440"
  evaluation:
    timeout: "30"
    dir: "/tmp/evaluations"
    dockerEnabled: "false"
    image: "eval-sandbox:latest"
    memoryLimit: "128m"
    cpuLimit: "0.5"
    timeoutSeconds: "30"
    networkDisabled: "true"
    readonlyRootfs: "true"
    maxOutputBytes: "65536"
  rateLimit:
    enabled: "true"
    anonymousLimit: "60"
    authenticatedLimit: "120"
    windowSeconds: "60"

# Secrets come from the generated Secret; override with --set secrets.* or
# wire in external-secrets. DEV DEFAULTS ONLY — production MUST override.
secrets:
  databaseUrl: "postgresql+psycopg://postgres:postgres@ai-eval-platform-postgres:5432/ai_eval"
  postgresPassword: "postgres"
  jwtSecretKey: "dev-secret-key-change-in-production"
  openaiApiKey: ""
  anthropicApiKey: ""

autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

ingress:
  enabled: true
  className: nginx
  host: ai-eval.local
  annotations: {}

serviceAccount:
  create: false
  name: ""