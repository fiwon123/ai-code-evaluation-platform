# Dev-sandbox Compose file (repo root) — lightweight Docker-based development.
#
# Replaces the old VS Code Dev Containers setup (`.devcontainer/`): a single
# prebuilt `dev` container (bind-mounted source, deps baked at image build)
# runs uvicorn + vite in the foreground, a `celery` service runs the
# evaluation worker, a `beat` service runs the periodic stale-submission
# recovery sweep, and `postgres` / `redis` provide infra. The `sandbox`
# service builds the air-gapped eval-sandbox image used to isolate untrusted
# code evaluation. Use `docker compose up dev` (or push `infra-up`).
#
# name is pinned so project volumes/networks keep the ai-eval_* prefix
# regardless of the repo directory name or where the compose file lives.
name: ai-eval

# Resource limits on every service prevent runaway processes from exhausting
# the host machine (e.g., heavy evaluations, build spikes). Ceilings are
# intentionally generous so normal dev workflows (uv sync, npm install,
# uvicorn, Vite) run comfortably while still bounding resource use.
# Note: limits apply to running containers with `docker compose up` (Compose v2).
services:
  # Dev sandbox — the coding/runtime environment. Source is bind-mounted for
  # hot reload; backend deps are baked into /opt/backend-venv; node_modules is
  # shared with the host and bootstrapped via npm ci when missing.
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["/sandbox/ai-code-evaluation-platform/dev-entrypoint.sh"]
    # Friendly hostname so prompts (`%n@%m`) and `hostname` clearly show you're
    # inside the sandbox (containers otherwise get a random hex ID).
    hostname: ai-eval-sandbox
    volumes:
      - .:/sandbox/ai-code-evaluation-platform:cached
      # Mount the host Docker socket so evaluations can spawn isolated
      # eval-sandbox containers (docker_sandbox uses the Python SDK).
      - /var/run/docker.sock:/var/run/docker.sock
      # Share the host gh CLI auth with the dev sandbox.
      - ${HOME}/.config/gh:/root/.config/gh:ro
      # Sandboxed AI coding agent: mount the host opencode binary + config and
      # git identity read-only so `opencode` can run INSIDE the dev container
      # (same trusted-agent model as gh: workspace bind mount + docker socket
      # are shared by design). `make dev-up` pre-creates ${HOME}/.config/opencode
      # and ${HOME}/.gitconfig so these mounts never fail on a fresh machine.
      - ${HOME}/.opencode/bin/opencode:/usr/local/bin/opencode:ro
      - ${HOME}/.config/opencode:/root/.config/opencode:ro
      - ${HOME}/.gitconfig:/root/.gitconfig:ro
    ports:
      - "8000:8000"
      - "5173:5173"
    environment:
      - DATABASE_URL=postgresql://postgres:mysecretpassword@postgres:5432/postgres
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=dev-secret-key-change-in-production
      - DOCKER_ENABLED=true
      - DOCKER_IMAGE=eval-sandbox:latest
      # Import the app package from the live bind-mounted source, never from a
      # baked editable install: `uv sync` at image build pins the editable
      # path at build time (previously /workspace/backend/src before the #129
      # workspace rename), so a stale image silently runs pre-merge code
      # (e.g. the worker discarding the recovery sweep as "unregistered").
      # PYTHONPATH precedes site-packages in sys.path and shadows that .pth.
      - PYTHONPATH=/sandbox/ai-code-evaluation-platform/backend/src
      # Forward the host GITHUB_TOKEN into the dev sandbox so `gh` (which the
      # agent uses for issues/PRs) actually works INSIDE the container: the
      # read-only ~/.config/gh mount only carries an invalid/stale stored token,
      # and gh prefers GH_TOKEN over that stored credential store. The token is
      # exported under both names — GH_TOKEN (what gh checks first) and
      # GITHUB_TOKEN (the GitHub Actions convention other tooling reads) — so
      # scripts inside the sandbox work regardless of which name they check.
      # The value is read from the host shell at compose-up time (interpolation
      # only — never written to the file), matching the existing trusted-agent
      # model (same trust as the ro gh config mount + bind-mounted workspace).
      - GH_TOKEN=${GH_TOKEN:-}
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    depends_on:
      # Celery runs with the dev sandbox by default (`docker compose up dev`)
      # so evaluations work out of the box; beat runs the stale-submission
      # recovery sweep on the same schedule. Celery must be *healthy* (pings
      # back on its control queue) — `service_started` alone would let the
      # sandbox come up next to a crash-looping worker and queue submissions
      # that nobody consumes.
      celery:
        condition: service_healthy
      beat:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      sandbox:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  # Celery worker — consumes evaluation tasks from Redis and runs LLM code
  # generation + sandboxed test execution. A managed Compose service (not a
  # background process) so it restarts automatically if it crashes. The
  # healthcheck pings the worker's control queue so `dev` (depends_on
  # service_healthy) never comes up against a dead/crash-looping consumer.
  celery:
    build:
      context: .
      dockerfile: Dockerfile
    # Re-sync the baked venv only when it's missing (same guard as
    # dev-entrypoint.sh) so an image predating a pyproject change can't
    # crash-loop the worker at import time.
    command: bash -c 'cd /sandbox/ai-code-evaluation-platform/backend && { [[ -x /opt/backend-venv/bin/celery ]] || uv sync; } && exec /opt/backend-venv/bin/celery -A app.core.celery_app:celery_app worker --loglevel=info'
    volumes:
      - .:/sandbox/ai-code-evaluation-platform:cached
      # Mount the host Docker socket so the Celery worker can create
      # isolated eval-sandbox containers for code evaluation.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - DATABASE_URL=postgresql://postgres:mysecretpassword@postgres:5432/postgres
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=dev-secret-key-change-in-production
      - DOCKER_ENABLED=true
      - DOCKER_IMAGE=eval-sandbox:latest
      # Live source (see dev service): stale images must not run baked code.
      - PYTHONPATH=/sandbox/ai-code-evaluation-platform/backend/src
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      sandbox:
        condition: service_completed_successfully
    healthcheck:
      # Pings *this* worker's control queue; fails while the worker is
      # starting (start_period) or when it's wedged/restarting.
      test: ["CMD-SHELL", "/opt/backend-venv/bin/celery -A app.core.celery_app:celery_app inspect ping -d celery@$${HOSTNAME} --timeout 5"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  # Celery beat — periodic scheduler. Runs the stale-submission recovery
  # sweep every minute so rows stranded in pending/processing (lost broker
  # messages, expired tasks, killed workers) self-heal instead of being stuck
  # forever. A dedicated service (worker -B is deprecated in Celery >= 5);
  # the schedule state file lives in /tmp so it never pollutes the repo.
  beat:
    build:
      context: .
      dockerfile: Dockerfile
    # Same venv guard as celery: sync only when the baked venv is missing so
    # an image predating a pyproject change can't crash-loop beat at import.
    command: bash -c 'cd /sandbox/ai-code-evaluation-platform/backend && { [[ -x /opt/backend-venv/bin/celery ]] || uv sync; } && exec /opt/backend-venv/bin/celery -A app.core.celery_app:celery_app beat --loglevel=info'
    volumes:
      - .:/sandbox/ai-code-evaluation-platform:cached
    environment:
      - DATABASE_URL=postgresql://postgres:mysecretpassword@postgres:5432/postgres
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=dev-secret-key-change-in-production
      # Live source (see dev service): stale images must not run baked code.
      - PYTHONPATH=/sandbox/ai-code-evaluation-platform/backend/src
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # Beat persists its schedule to /tmp/celerybeat-schedule* (shelve db):
      # written at startup and every 3 min while ticking (Celery sync_every),
      # so a deadlocked or wedged beat stops refreshing the file. Failing the
      # check when the newest schedule file is older than 5 min catches a
      # process that is alive but no longer ticking — which otherwise silently
      # stops the stale-submission recovery sweep.
      test: ["CMD-SHELL", "test -n \"$(find /tmp -maxdepth 1 -name 'celerybeat-schedule*' -mmin -5 2>/dev/null)\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # Builds the eval-sandbox image (multi-language runtimes) used to isolate
  # untrusted code execution. One-shot: builds the image, then exits.
  sandbox:
    build:
      context: .
      dockerfile: backend/Dockerfile.sandbox
    image: eval-sandbox:latest
    command: ["true"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    # Named volume so the Celery broker queue survives `docker compose down`
    # (data kept across dev-restart, like postgres_data). Tasks queued but not
    # yet acked are redelivered when the worker reconnects after a restart.
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  postgres_data:
  redis_data: