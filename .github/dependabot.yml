version: 2
# Every ecosystem targets `dev`, not the default branch (`main`). Without an
# explicit `target-branch` Dependabot opens PRs against the default branch, and
# a dependency bump landing straight on `main` is a release: no milestone, no
# issue link, and no review against the integration branch. See AGENTS.md →
# Branch Strategy (`main` <- `dev` <- feature branches).
updates:
  # Backend dependencies (pip/uv)
  - package-ecosystem: "pip"
    directory: "/backend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "deps"
    groups:
      core:
        patterns:
          - "fastapi"
          - "sqlalchemy"
          - "alembic"
      ai:
        patterns:
          - "openai"
          - "anthropic"

  # Frontend dependencies (npm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "deps"
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "react-router-dom"
      vite:
        patterns:
          - "vite"
          - "typescript"
          - "oxlint"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
