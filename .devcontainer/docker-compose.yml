# Resource limits on every service prevent runaway processes from exhausting
# the host machine (e.g., heavy evaluations, build spikes). Ceilings are
# intentionally generous so normal dev workflows (uv sync, npm install,
# uvicorn, Vite) run comfortably while still bounding resource use.
# Note: limits apply to running containers with `docker compose up` (Compose v2).
services:
  backend:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
      # Mount the host Docker socket so the Celery worker can create
      # isolated eval-sandbox containers for code evaluation.
      - /var/run/docker.sock:/var/run/docker.sock
      # Persist gh CLI auth config (~/.config/gh) across container rebuilds.
      - gh_config:/root/.config/gh
    command: tail -f /dev/null
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:mysecretpassword@postgres:5432/postgres
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=dev-secret-key-change-in-production
      - DOCKER_ENABLED=true
      - DOCKER_IMAGE=eval-sandbox:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      sandbox:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

  # Celery worker — consumes evaluation tasks from Redis and runs LLM code
  # generation + sandboxed test execution. A managed Compose service (not a
  # background process) so it restarts automatically if it crashes.
  celery:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
      # Mount the host Docker socket so the Celery worker can create
      # isolated eval-sandbox containers for code evaluation.
      - /var/run/docker.sock:/var/run/docker.sock
    command: bash -c 'until /workspace/.devcontainer/start-celery.sh; do sleep 5; done; exec tail -f /dev/null'
    environment:
      - DATABASE_URL=postgresql://postgres:mysecretpassword@postgres:5432/postgres
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=dev-secret-key-change-in-production
      - DOCKER_ENABLED=true
      - DOCKER_IMAGE=eval-sandbox:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      sandbox:
        condition: service_completed_successfully
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  # Builds the eval-sandbox image (pytest pre-installed) used to isolate
  # untrusted code execution. One-shot: builds the image, then exits.
  sandbox:
    build:
      context: ..
      dockerfile: backend/Dockerfile.sandbox
    image: eval-sandbox:latest
    command: ["true"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  frontend:
    image: mcr.microsoft.com/devcontainers/javascript-node:22
    volumes:
      - ..:/workspace:cached
    command: bash -c "/workspace/.devcontainer/start-frontend.sh; exec tail -f /dev/null"
    ports:
      - "5173:5173"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  postgres_data:
  # Persists gh CLI authentication across devcontainer rebuilds.
  gh_config:
