services:
  backend:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
      # Mount the host Docker socket so the Celery worker can create
      # isolated eval-sandbox containers for code evaluation.
      - /var/run/docker.sock:/var/run/docker.sock
    command: tail -f /dev/null
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:mysecretpassword@postgres:5432/postgres
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET_KEY=dev-secret-key-change-in-production
      - DOCKER_ENABLED=true
      - DOCKER_IMAGE=eval-sandbox:latest
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      sandbox:
        condition: service_completed_successfully

  # Builds the eval-sandbox image (pytest pre-installed) used to isolate
  # untrusted code execution. One-shot: builds the image, then exits.
  sandbox:
    build:
      context: ..
      dockerfile: backend/Dockerfile.sandbox
    image: eval-sandbox:latest
    command: ["true"]

  frontend:
    image: mcr.microsoft.com/devcontainers/javascript-node:22
    volumes:
      - ..:/workspace:cached
    command: bash -c "/workspace/.devcontainer/start-frontend.sh; exec tail -f /dev/null"
    ports:
      - "5173:5173"
    depends_on:
      - backend

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
