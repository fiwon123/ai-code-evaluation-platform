# mise.toml — single source of truth for the project toolchain (host + dev image).
#
# Host:
#   scripts/setup-host-tools.sh installs mise, then `mise install` (from the
#   repo root) provisions the exact toolchain from this file — including the
#   optional Kubernetes tools, replacing the old hand-rolled download script.
#
# Dev image:
#   The dev image (Dockerfile) bakes the runtime versions explicitly so the
#   build stays offline-reproducible (no fetch at container creation). Keep the
#   pinned versions in this file in sync with the Dockerfile ARGs:
#     - node  = v22.23.2   (Dockerfile `ARG NODE_VERSION`)
#     - gh    = 2.101.0    (Dockerfile `ARG GH_CLI_VERSION`)
#     - uv    = any 0.12.x (Dockerfile: ghcr.io/astral-sh/uv:latest)
#
# Python is NOT managed here — the backend uses uv-managed Python
# (backend/pyproject.toml, requires-python ">=3.14").

[tools]
node = "22.23.2"   # matches Dockerfile NODE_VERSION (frontend toolchain)
uv = "0.12"        # backend package manager (Python 3.14)
gh = "2.101.0"     # GitHub CLI, matches Dockerfile GH_CLI_VERSION

# Kubernetes toolchain (optional — `make k8s-setup` / `make k8s-dev` etc.)
kind = "0.24"
kubectl = "1.31"
kustomize = "5.4"
helm = "3.16"
devspace = "6.3.21"