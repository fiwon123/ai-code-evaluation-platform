# glibc address-selection precedence for the dev image (issue #270).
#
# WHY THIS FILE EXISTS
#
# Groq's edge answers the *same* authenticated request two different ways:
#
#     IPv4  -> 403 Forbidden
#     IPv6  -> 401 Unauthorized   (reached auth; only the credentials are missing)
#
# That makes an address-family problem look exactly like a bad API key: nothing
# in the error says "wrong network", and a valid key still fails. Two layers
# decide which family a request uses, and BOTH had to be fixed:
#
#   1. Reachability — an IPv4-only Docker bridge leaves a container with no IPv6
#      address at all. Fixed in docker-compose.yml (`enable_ipv6: true` + a ULA
#      subnet). Necessary, and on its own it changes nothing.
#   2. Selection — a container holding both addresses still dials whichever one
#      getaddrinfo returns FIRST, because httpcore has no Happy Eyeballs (plain
#      curl does, which is why `curl` reaches auth here while the worker gets
#      403 — do not treat a working curl as evidence about the worker). This
#      file is the second fix.
#
# WHAT IT DOES
#
# `precedence` is RFC 3484's policy table. Rule 6: PREFER THE HIGHER VALUE.
# The destination is sorted by that value, so a larger number means earlier in
# the getaddrinfo() list. Crucially, RFC 3484 section 2.1 says that to look up
# the attributes of an IPv4 address you look up its IPv4-MAPPED address
# (`::ffff:104.18.38.236`), so IPv4 competes in this table as ::ffff:0:0/96.
#
# THE TRAP THAT MADE AN EARLIER VERSION OF THIS FILE A NO-OP
#
# gai.conf(5): "the presence of a single precedence line in the configuration
# file causes the default table to not be used." Declaring ANY precedence rule
# therefore discards glibc's entire built-in table — the whole table has to be
# restated here, not just the rules being changed.
#
# A previous version of this file declared only `::/0 100`. That is the worst
# possible omission, because ::/0 is the catch-all: IPv4-mapped addresses match
# it too, so both families were given 100, the sort was a tie, and RFC 3484
# Rule 10 ("otherwise, leave the order unchanged") left the resolver's order —
# IPv4 first. Measured in the rebuilt image: getaddrinfo returned
# `v4 v4 v6 v6` and the worker still got 403, with the file correctly installed.
#
# The rule learned: when overriding this table, ALWAYS restate ::ffff:0:0/96.
# Its absence is silent — it does not error, it just stops expressing a
# preference at all.
#
# THE TABLE
#
# This is the RFC 3484 default table exactly as printed in `man gai.conf`, so it
# can be diffed against the manual and it does not depend on whatever the base
# image's built-in table happens to be. glibc's defaults already preferred IPv6
# (::/0 at 40 vs ::ffff:0:0/96 at 10), which is why the host — whose
# /etc/gai.conf is all comments — reached 401 while this container did not.
# Debian's file ships `precedence ::ffff:0:0/96 100`, raising IPv4 above IPv6
# and so sorting IPv4 first. Restating the default table is what reverses that.
#
# Loopback keeps the highest value (50) so a name resolving to ::1 alongside a
# global address is not reordered behind it. `precedence` is a preference, not
# a restriction: glibc's connect() still walks the remaining addresses, so a
# host or service without working IPv6 degrades to IPv4 instead of failing.
# Everything else in this stack is IPv4-only by name anyway (postgres, redis,
# the sandbox, host.docker.internal), so nothing else here changes family.
#
# SCOPE AND SAFETY
#
# Applied to the dev image only (dev + celery). The evaluation sandbox
# (backend/Dockerfile.sandbox) is deliberately NOT given this file: it runs
# generated code, is air-gapped, and must never gain outbound IPv6.
#
# backend/tests/test_provider_host_reachability.py locks this file's intent —
# including the ::ffff:0:0/96 rule that the earlier version omitted — and the
# fact that the sandbox image is left alone.
precedence ::1/128        50
precedence ::/0           40
precedence 2002::/16      30
precedence ::/96          20
precedence ::ffff:0:0/96  10
