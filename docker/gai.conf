# glibc address-selection precedence for the dev image (issue #270).
#
# WHY THIS FILE EXISTS
#
# Groq's edge answers the *same* authenticated request two different ways:
#
#     IPv4  -> 403 Forbidden
#     IPv6  -> 401 Unauthorized   (reached auth; only the credentials are missing)
#
# That makes an address-family problem look exactly like a bad API key: nothing
# in the error says "wrong network", and a valid key still fails. Two layers
# decide which family a request uses, and BOTH had to be fixed:
#
#   1. Reachability — an IPv4-only Docker bridge leaves a container with no IPv6
#      address at all. Fixed in docker-compose.yml (`enable_ipv6: true` + a ULA
#      subnet). That is necessary, and on its own it changes nothing.
#   2. Selection — a container that *has* both still dials whichever its
#      resolver returns first. Debian's /etc/gai.conf ships exactly one active
#      rule, `precedence ::ffff:0:0/96 100`, which puts IPv4 above IPv6, so every
#      request went out over v4 and got the 403. This file is the second fix.
#
# The host's /etc/gai.conf is all comments, so plain `curl` on the host already
# preferred IPv6 and reached 401. That is why the bug was invisible from the host
# and only appeared in the worker: measuring the host proved nothing about the
# container. Check the container, not the host.
#
# WHAT IT DOES
#
# `precedence` sets the RFC 3484 destination-address sorting table glibc uses to
# order getaddrinfo() results, so this flips IPv6 ahead of IPv4. ::1 keeps its
# own higher value so loopback still sorts first among the v6 addresses.
#
# SCOPE AND SAFETY
#
# Applied to the dev image only (dev + celery). The evaluation sandbox
# (backend/Dockerfile.sandbox) is deliberately NOT given this file: it runs
# generated code, is air-gapped, and must never gain outbound IPv6.
#
# Precedence is a *preference*, not a restriction. A name that resolves to both
# families is dialled v6-first, and glibc's connect still walks the remaining
# addresses, so a host or service without working IPv6 degrades to IPv4 instead
# of failing. Everything else in this stack is IPv4-only by name anyway
# (postgres, redis, the sandbox, host.docker.internal), so nothing else here
# changes family. backend/tests/test_provider_host_reachability.py locks both
# the intent of this file and the fact that the sandbox image is left alone.
precedence ::1/128  50
precedence ::/0     100

# Why these numbers: glibc's RFC 3484 built-in table puts global IPv6 (::/0) at
# 40 and IPv4 at 4, and Debian's file only overrides ::ffff:0:0/96 (to 100),
# which is what tipped the order to IPv4. The values above keep that shape —
# loopback highest, global IPv6 above it, IPv4 lowest — so the sort is decided by
# family rather than by the base image. Anything above 4 works for ::/0; 100 is
# used so no v4-favouring rule can be added later without tripping the guard in
# backend/tests/test_provider_host_reachability.py.
