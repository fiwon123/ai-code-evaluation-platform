# WebSocket upgrade passthrough. `map` is only valid in the http context, and
# this file is included from nginx.conf's http block, so it must sit OUTSIDE the
# server block below. `$http_upgrade` is empty for plain HTTP requests, in which
# case the connection is forwarded normally (close) instead of upgraded.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Content-Security-Policy for the SPA. The API deliberately does not emit a
    # CSP (see backend/src/app/core/security_headers.py): the SPA server knows the
    # exact asset/API origins. Applied here so it is inherited by the locations
    # that do not declare their own add_header — notably `location /`, which
    # serves the document through the SPA fallback.
    #   * style-src 'unsafe-inline' — React writes inline style attributes.
    #   * connect-src 'self'      — REST + the /api/ws subscription socket.
    #   * frame-ancestors 'none'  — no clickjacking (matches the API's
    #                                X-Frame-Options: DENY).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;

    # gzip static assets
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # SPA fallback — all non-file routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy API requests to the backend service. This also carries the
    # submission WebSocket (`/api/ws/...`), so the Upgrade/Connection headers
    # must be forwarded for the handshake to succeed. proxy_read_timeout only
    # fires when the upstream goes quiet — the backend pings every 15s.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    # Cache hashed build assets aggressively.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}